; Avrkr Cloud multi-tenant dialplan (include from extensions.conf)
; Add: #include "includes/extensions_avrkr_cloud.conf"

[from-trunk]
exten => _X.,1,NoOp(Inbound DID ${EXTEN})
 same => n,Set(TENANT_ID=${ODBC_AVRKR_TENANT_ID(${EXTEN})})
 same => n,Set(ACCOUNT_CODE=${ODBC_AVRKR_ACCOUNT_CODE(${EXTEN})})
 same => n,Set(CHANNEL(accountcode)=${ACCOUNT_CODE})
 same => n,Gosub(tenant-inbound,${EXTEN},1)
 same => n,Hangup()

[tenant-inbound]
exten => _X.,1,NoOp(Tenant ${TENANT_ID} inbound route)
 same => n,Gosub(avrkr-route-inbound,${TENANT_ID},1(${EXTEN}))
 same => n,Hangup()

[avrkr-route-inbound]
exten => _X.,1,NoOp(Route inbound for tenant ${EXTEN} DID ${ARG1})
 same => n,Return()

[tenant-outbound]
exten => _9X.,1,NoOp(Outbound tenant ${TENANT_ID})
 same => n,Set(OUTNUM=${EXTEN:1})
 same => n,Dial(PJSIP/${OUTNUM}@tenant-${TENANT_ID}-trunk,60)
 same => n,Hangup()

[tenant-internal]
exten => _XXXX,1,NoOp(Internal call tenant ${TENANT_ID} to ${EXTEN})
 same => n,Set(CHANNEL(accountcode)=${ACCOUNT_CODE})
 same => n,Dial(PJSIP/t${TENANT_ID}-ext-${EXTEN},30)
 same => n,Hangup()

[tenant-ivr]
exten => s,1,NoOp(IVR entry)
 same => n,Return()

[tenant-queue]
exten => s,1,NoOp(Queue entry)
 same => n,Return()

[tenant-voicemail]
exten => s,1,NoOp(Voicemail)
 same => n,VoiceMail(${MAILBOX}@tenant-${TENANT_ID})
 same => n,Hangup()
